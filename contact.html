<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Adam</title>
    <script src="script.js"></script>
</head>
<body>
    <header>
        <button onclick="location.href='index.html'">Strona Główna</button>
        <button onclick="location.href='about.html'">O mnie</button>
        <button onclick="location.href='contact.html'">Kontakt</button>
    </header><br><hr>
    <main>
        <section id="ja">
            <p id="email"></p>
            <button id="anim" onclick="window.location.reload()">Chce zobaczyc animacje jeszcze raz</button>
        </section>
    </main>
    <script>
        var i = 0;
        var txt = 'E-Mail: PatrickBateman@sigma.boi';
        var speed = 50;
        function typeWriter() {
            if (i < txt.length) {
                document.getElementById("email").innerHTML += txt.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
            if (i === txt.length) {
                document.getElementById("anim").style.opacity = "1";
            }
        }
        typeWriter();
    </script>
</body>
</html>
